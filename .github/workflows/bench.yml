name: ci-sdk bench
on:
  push:
    branches: [ci-sdk-bench]
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=8192
  TURBO_CACHE: local:rw
  TURBO_TELEMETRY_DISABLED: 1
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24.22.1 }
      - id: ci
        uses: ./.ci-sdk-action
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Diagnose
        run: |
          nproc; lscpu | grep 'Model name'; free -m | sed -n 2p
          grep -E '^(Dirty|Writeback):' /proc/meminfo; cat /proc/pressure/io /proc/pressure/cpu
          ps -eo pcpu,etime,args --sort=-pcpu | head -6 | cut -c1-110
          node -e "const t=Date.now();let x=0;for(let i=0;i<2e9;i++)x+=i%7;console.log('cpu-bench-ms',Date.now()-t,x)"
      - name: Build
        run: pnpm turbo build --filter ./stores/libsql --filter mastra --filter @mastra/memory
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24.22.1 }
      - id: ci
        uses: ./.ci-sdk-lean
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Diagnose
        run: |
          nproc; lscpu | grep 'Model name'; free -m | sed -n 2p
          grep -E '^(Dirty|Writeback):' /proc/meminfo; cat /proc/pressure/io /proc/pressure/cpu
          ps -eo pcpu,etime,args --sort=-pcpu | head -6 | cut -c1-110
          node -e "const t=Date.now();let x=0;for(let i=0;i<2e9;i++)x+=i%7;console.log('cpu-bench-ms',Date.now()-t,x)"
      - name: Build
        run: pnpm turbo build --filter ./stores/libsql --filter mastra --filter @mastra/memory
  full-dropped:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24.22.1 }
      - id: ci
        uses: ./.ci-sdk-action
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Diagnose
        run: |
          nproc; lscpu | grep 'Model name'; free -m | sed -n 2p
          grep -E '^(Dirty|Writeback):' /proc/meminfo; cat /proc/pressure/io /proc/pressure/cpu
          ps -eo pcpu,etime,args --sort=-pcpu | head -6 | cut -c1-110
          node -e "const t=Date.now();let x=0;for(let i=0;i<2e9;i++)x+=i%7;console.log('cpu-bench-ms',Date.now()-t,x)"
      - name: Drop page cache
        run: sync && sudo sysctl -q vm.drop_caches=3
      - name: Build
        run: pnpm turbo build --filter ./stores/libsql --filter mastra --filter @mastra/memory
  lean-synced:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { run_install: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24.22.1 }
      - id: ci
        uses: ./.ci-sdk-lean
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Diagnose
        run: |
          nproc; lscpu | grep 'Model name'; free -m | sed -n 2p
          grep -E '^(Dirty|Writeback):' /proc/meminfo; cat /proc/pressure/io /proc/pressure/cpu
          ps -eo pcpu,etime,args --sort=-pcpu | head -6 | cut -c1-110
          node -e "const t=Date.now();let x=0;for(let i=0;i<2e9;i++)x+=i%7;console.log('cpu-bench-ms',Date.now()-t,x)"
      - name: Flush writes
        run: time sync
      - name: Build
        run: pnpm turbo build --filter ./stores/libsql --filter mastra --filter @mastra/memory
